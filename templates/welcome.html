<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eclaro Academy - Visitor Management System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .logo-box {
            background-color: #f0f7f0;
            color: #2e7d32;
            font-size: 32px;
            font-weight: bold;
            width: 80px;
            height: 80px;
            line-height: 80px;
            border-radius: 16px;
            margin: 0 auto 20px auto;
        }
        h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 5px;
        }
        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .btn {
            background-color: #7cb342;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #689f38;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo-box">E</div>
        <div style="font-size: 12px; color: #888; margin-bottom: 10px;">SY 2026–2027</div>
        <h1>Eclaro Academy</h1>
        <p>Visitor Management System</p>
        
        <!-- Nakaturo na ito sa /login sa halip na /register -->
        <a href="/login" class="btn">Get Started &rarr;</a>
    </div>

    <div class="footer">
        &copy; 2026 Eclaro Academy, Inc. All rights reserved.
    </div>

</body>
</html>
